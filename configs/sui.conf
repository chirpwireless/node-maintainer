# Sui Node Configuration
# Repository information
REPO="MystenLabs/sui"

# Binary names
PRIMARY_BIN="sui-node"
SECONDARY_BIN="sui-tool"

# Service name for systemd
SERVICE_NAME="sui"

# Installation paths (can be customized per node type)
INSTALL_DIR="/usr/local/bin"
DOWNLOAD_DIR="/mnt/bin"

# Binary naming pattern for downloads
# Available variables: NETWORK, VERSION, ARCH
BINARY_NAME_PATTERN="sui-\${NETWORK}-v\${VERSION}-\${ARCH}.tgz"

# Version extraction regex (used with grep -oP)
VERSION_REGEX="sui-node \\K[0-9]+\\.[0-9]+\\.[0-9]+"

# Default network if not specified
DEFAULT_NETWORK="testnet"

# GraphQL stack configuration (optional)
# Set GRAPHQL_ENABLED=true to also update sui-graphql docker compose stack
GRAPHQL_ENABLED="true"
GRAPHQL_DIR="/opt/sui-graphql"
GRAPHQL_ENV_FILE="/opt/sui-graphql/.env"
GRAPHQL_VERSION_VAR="SUI_VERSION"
# Build commit extraction regex (used with grep -oP on "sui-node --version", e.g. "sui-node 1.83.1-6a567faf6de1")
COMMIT_REGEX="sui-node [0-9]+\\.[0-9]+\\.[0-9]+-\\K[0-9a-f]+"
